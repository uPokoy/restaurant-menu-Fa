<!doctype html>
<html lang="ru" class="fa-starting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Меню">
<title>Меню</title>
<link rel="icon" href="favicon.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180">
<style>html.fa-starting body{visibility:hidden}</style>
<noscript><style>html.fa-starting body{visibility:visible}</style></noscript>
<script>setTimeout(function(){document.documentElement.classList.remove('fa-starting')},5000)</script>
<link rel="stylesheet" href="fa-core-v1.css?build=1.1">
<link rel="stylesheet" href="fa-redesign-v3.css?build=1.1">
<link rel="stylesheet" href="fa-compact-card-v1.css?build=1.4">
<link rel="stylesheet" href="fa-wide-card-v1.css?build=1.0">
<link rel="stylesheet" href="fa-scroll-stability-v1.css?build=1.1">
<link rel="stylesheet" href="fa-home-sections-v1.css?build=1.2">
<link rel="stylesheet" href="fa-home-polish-v1.css?build=1.0">
<link rel="stylesheet" href="fa-novelty-card-fix-v1.css?build=1.0">
<link rel="stylesheet" href="fa-cart-badge-fix-v1.css?build=1.0">
<link rel="stylesheet" href="fa-admin-polish-v1.css?build=1.0">
</head>
<body class="theme-dark">
<header><h1 id="title">МЕНЮ</h1><p>Свежие блюда каждый день</p></header>
<nav id="nav" aria-label="Разделы меню"></nav>

<main>
  <div id="menuPage"></div>
  <div id="appearancePage" class="hidden"></div>
  <div id="cartPage" class="hidden"></div>

  <div id="addPage" class="panel hidden">
    <h2>Добавление блюд</h2>
    <div class="add-layout">
      <div class="add-card">
        <h3 id="formTitle">Новое блюдо</h3>
        <label>Категория</label>
        <select id="fCat"></select>
        <label>Название блюда</label>
        <input id="fName" placeholder="Например, Солянка">
        <label>Описание</label>
        <textarea id="fDesc" placeholder="Краткое описание блюда"></textarea>
        <label>Ингредиенты</label>
        <textarea id="fIng" placeholder="Основные ингредиенты"></textarea>
        <label>КБЖУ</label>
        <div class="nutrition-inputs">
          <input id="fKcal" type="number" min="0" step="0.1" placeholder="Ккал">
          <input id="fProtein" type="number" min="0" step="0.1" placeholder="Белки, г">
          <input id="fFat" type="number" min="0" step="0.1" placeholder="Жиры, г">
          <input id="fCarbs" type="number" min="0" step="0.1" placeholder="Углеводы, г">
        </div>
        <label>Фото</label>
        <input id="fPhoto" type="file" accept="image/*">
        <div class="actions">
          <button class="btn primary" onclick="saveDish()">Добавить</button>
          <button class="btn" onclick="cancelEdit()">Очистить</button>
        </div>
      </div>

      <div class="add-card">
        <h3>Категории</h3>
        <div class="small">Создайте любую категорию: Напитки, Завтраки, Пицца и т. д.</div>
        <div class="actions category-actions">
          <input id="newCat" placeholder="Название новой категории">
          <button class="btn primary" onclick="addCategory()">Добавить</button>
        </div>
      </div>

      <details class="add-card add-full collapsible-list">
        <summary>Категории</summary>
        <div id="catList"></div>
      </details>

      <details class="add-card add-full collapsible-list">
        <summary>Блюда</summary>
        <div id="dishAdmin"></div>
      </details>
    </div>
  </div>
</main>
<footer></footer>

<script>
const DEFAULT_CATS=["Супы","Вторые блюда","Салаты","Выпечка","Десерты"];
function readStoredArray(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key)||"null");
    return Array.isArray(value)?value:fallback;
  }catch(e){return fallback;}
}
let cats=readStoredArray("restaurantCategories",[...DEFAULT_CATS]);
let dishes=readStoredArray("restaurantMenu",[]);
let editId=null;
let currentFilter="all";
let currentView="menu";
let adminUnlocked=false;

const nav=document.getElementById("nav");
const menuPage=document.getElementById("menuPage");
const addPage=document.getElementById("addPage");
const appearancePage=document.getElementById("appearancePage");
const cartPage=document.getElementById("cartPage");
const fCat=document.getElementById("fCat");
const fName=document.getElementById("fName");
const fDesc=document.getElementById("fDesc");
const fIng=document.getElementById("fIng");
const fKcal=document.getElementById("fKcal");
const fProtein=document.getElementById("fProtein");
const fFat=document.getElementById("fFat");
const fCarbs=document.getElementById("fCarbs");
const fPhoto=document.getElementById("fPhoto");
const formTitle=document.getElementById("formTitle");
const newCat=document.getElementById("newCat");
const catList=document.getElementById("catList");
const dishAdmin=document.getElementById("dishAdmin");

function persist(){
  localStorage.setItem("restaurantCategories",JSON.stringify(cats));
  localStorage.setItem("restaurantMenu",JSON.stringify(dishes));
}
function syncNavActive(){
  document.querySelectorAll("#nav button").forEach(btn=>{
    const view=btn.dataset.view||"";
    const filter=btn.dataset.filter||"";
    const active=(currentView==="menu"&&view==="menu"&&filter===currentFilter)||(currentView===view&&view!=="menu");
    btn.classList.toggle("active",active);
  });
}
function renderNav(){
  nav.innerHTML="";
  const main=document.createElement("button");
  main.textContent="Главная"; main.dataset.view="menu"; main.dataset.filter="all";
  main.onclick=()=>showMenu(main,"all"); nav.appendChild(main);
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c; b.dataset.view="menu"; b.dataset.filter=c;
    b.onclick=()=>showMenu(b,c); nav.appendChild(b);
  });
  const add=document.createElement("button");
  add.textContent="➕"; add.title="Добавить"; add.setAttribute("aria-label","Добавить"); add.dataset.view="add";
  add.onclick=()=>showAdd(add); nav.appendChild(add);
  const cart=document.createElement("button");
  cart.className="cart-btn"; cart.id="cartNav"; cart.dataset.view="cart"; cart.onclick=()=>showCart(cart); nav.appendChild(cart);
  const appearance=document.createElement("button");
  appearance.textContent="⚙️"; appearance.className="settings-gear"; appearance.title="Настройки"; appearance.setAttribute("aria-label","Настройки"); appearance.dataset.view="appearance";
  appearance.onclick=()=>showAppearance(appearance); nav.appendChild(appearance);
  syncNavActive(); updateCartBadge();
}
function hidePages(){
  menuPage.classList.add("hidden");
  addPage.classList.add("hidden");
  appearancePage.classList.add("hidden");
  cartPage.classList.add("hidden");
}
function showMenu(btn,cat){
  currentView="menu"; currentFilter=cat||"all";
  hidePages(); menuPage.classList.remove("hidden");
  drawMenu(currentFilter); syncNavActive();
}
function showCart(btn){
  currentView="cart"; hidePages(); cartPage.classList.remove("hidden"); syncNavActive(); drawCart();
  window.scrollTo({top:0,behavior:"smooth"});
}
function showAppearance(btn){
  currentView="appearance"; hidePages(); appearancePage.classList.remove("hidden"); syncNavActive(); drawAppearance();
  window.scrollTo({top:0,behavior:"smooth"});
}

function cartItems(){try{return JSON.parse(localStorage.getItem("restaurantCart")||"{}")||{};}catch(e){return {};}}
function saveCart(c){localStorage.setItem("restaurantCart",JSON.stringify(c||{}));updateCartBadge();}
function cartCount(){return Object.values(cartItems()).reduce((sum,n)=>sum+Number(n||0),0);}
function updateCartBadge(){
  const b=document.getElementById("cartNav"); if(!b)return;
  const n=cartCount();
  b.innerHTML=`🛒${n?` <span class="cart-count">${n}</span>`:""}`;
  b.title=n?`В корзине: ${n}`:"Корзина"; b.setAttribute("aria-label",b.title);
}
function addToCart(id){const d=dishes.find(x=>String(x.id)===String(id));if(!d)return;const c=cartItems();c[id]=(Number(c[id])||0)+1;saveCart(c);if(currentView==="menu")drawMenu(currentFilter);}
function removeFromCart(id){const c=cartItems();if(!c[id])return;c[id]=Number(c[id])-1;if(c[id]<=0)delete c[id];saveCart(c);drawCart();}
function removeCartItem(id){const c=cartItems();delete c[id];saveCart(c);drawCart();}
function clearCart(){if(!cartCount())return;if(!confirm("Очистить корзину?"))return;saveCart({});drawCart();}
function drawCart(){
  const c=cartItems(); const ids=Object.keys(c);
  if(!ids.length){cartPage.innerHTML='<div class="cart-layout"><div class="cart-card"><h2>Корзина</h2><div class="cart-empty">Корзина пуста</div></div></div>';return;}
  let total=0;
  cartPage.innerHTML=`<div class="cart-layout"><div class="cart-card"><h2>Корзина</h2>${ids.map(id=>{
    const d=dishes.find(x=>String(x.id)===String(id)); if(!d)return"";
    const q=Number(c[id])||0; total+=q;
    return `<div class="cart-item">${d.photo?`<img class="cart-thumb" src="${escAttr(d.photo)}" alt="" loading="lazy">`:'<div class="cart-thumb"></div>'}<div><div class="cart-item-name">${esc(d.name)}</div><div class="small">${esc(d.cat)}</div></div><div class="cart-actions"><button class="btn" onclick="removeFromCart(${JSON.stringify(d.id)})">−</button><span class="cart-qty">${q}</span><button class="btn" onclick="addToCart(${JSON.stringify(d.id)});drawCart()">+</button><button class="btn" onclick="removeCartItem(${JSON.stringify(d.id)})">Удалить</button></div></div>`;
  }).join("")}<div class="cart-total"><span>Всего блюд</span><span>${total}</span></div><div class="actions"><button class="btn" onclick="clearCart()">Очистить корзину</button></div></div></div>`;
}

const STANDARD_BACKGROUNDS=[
  {name:"Мрамор и золото",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/01"},
  {name:"Тёплое кафе",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/02"},
  {name:"Дерево и зелень",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/03"},
  {name:"Чёрный премиум",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/04"},
  {name:"Современный мрамор",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/05"},
  {name:"Светлое дерево",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/06"},
  {name:"Классический уют",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/07"},
  {name:"Fine dining",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/08"},
  {name:"Вечерний ресторан",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/09"},
  {name:"Зелёный бархат",url:"https://jrpialhwbliicbsmzmvb.supabase.co/storage/v1/object/public/menu-photos/backgrounds/10"}
];
function drawAppearance(){
  const bg=localStorage.getItem("restaurantMenuBackground")||"";
  const blur=localStorage.getItem("restaurantBackgroundBlur")||0;
  appearancePage.innerHTML=`<div class="appearance-wrap"><div class="appearance-card"><h2>Вид</h2>
  <div class="appearance-section"><h3>Размытие</h3><div class="range-row"><input id="bgBlur" type="range" min="0" max="100" step="1" value="${escAttr(blur)}" oninput="setBackgroundBlur(this.value)"><span id="bgBlurValue" class="range-value">${esc(blur)}%</span></div><div class="range-scale"><span>0% — без размытия</span><span>100% — максимум</span></div></div>
  <div class="appearance-section"><h3>Фон</h3><div class="small">Выберите готовый фон для меню.</div><div class="bg-grid">${STANDARD_BACKGROUNDS.map((x,i)=>`<button class="bg-option ${bg===x.url?'active':''}" style="background-image:url('${x.url.replace(/'/g,"%27")}')" onclick="setStandardBackground(${i})"><span>${esc(x.name)}</span></button>`).join('')}</div></div>
  <div class="appearance-section"><h3>Загрузить фон</h3><label>Загрузить фотографию</label><input id="bgFile" type="file" accept="image/*"><div class="appearance-actions"><button class="btn primary" onclick="saveBackground()">Установить</button><button class="btn" onclick="resetBackground()">По умолчанию</button></div><div id="bgPreview" class="bg-preview" style="${bg?`background-image:url(${JSON.stringify(bg).slice(1,-1)})`:''}"><span>${bg?'Текущий фон':'Фон по умолчанию'}</span></div></div>
  </div></div>`;
}
function setBackgroundBlur(value){const v=Math.max(0,Math.min(100,Number(value)||0));localStorage.setItem("restaurantBackgroundBlur",String(v));applyBackgroundBlur();const out=document.getElementById("bgBlurValue");if(out)out.textContent=`${v}%`;}
function applyBackgroundBlur(){const raw=localStorage.getItem("restaurantBackgroundBlur");const v=raw===null?0:Math.max(0,Math.min(100,Number(raw)||0));document.documentElement.style.setProperty("--site-bg-blur",`${v*.6}px`);}
function setStandardBackground(index){const item=STANDARD_BACKGROUNDS[index];if(!item)return;localStorage.setItem("restaurantMenuBackground",item.url);applyBackground();drawAppearance();}
function saveBackground(){const file=document.getElementById("bgFile")?.files?.[0];if(!file)return alert("Выберите фотографию.");const r=new FileReader();r.onload=()=>{localStorage.setItem("restaurantMenuBackground",r.result);applyBackground();drawAppearance();};r.readAsDataURL(file);}
function resetBackground(){localStorage.removeItem("restaurantMenuBackground");applyBackground();drawAppearance();}
function applyBackground(){const bg=localStorage.getItem("restaurantMenuBackground");if(bg){document.body.classList.add("menu-custom-bg");document.documentElement.style.setProperty("--site-bg-image",`url(${JSON.stringify(bg).slice(1,-1)})`);}else{document.body.classList.remove("menu-custom-bg");document.documentElement.style.setProperty("--site-bg-image","none");}applyBackgroundBlur();}
function applyTheme(){document.body.classList.add("theme-dark");document.body.classList.remove("theme-light");}
function applyDishTransparency(){}
function applyCategoryTransparency(){}
function applyNavTransparency(){syncNavActive();}

async function requireAdmin(){
  if(adminUnlocked)return true;
  const cloud=window.restaurantMenuCloudSync;
  if(!cloud||typeof cloud.adminLogin!=="function"){alert("Облачная синхронизация ещё подключается. Повторите через несколько секунд.");return false;}
  if(typeof cloud.hasAdminSession==="function"&&cloud.hasAdminSession()){
    try{if(await cloud.adminCheck()){adminUnlocked=true;return true;}}catch(e){}
  }
  const entered=prompt("Введите пароль для доступа к добавлению блюд:");
  if(entered===null)return false;
  try{await cloud.adminLogin(entered);adminUnlocked=true;return true;}catch(e){alert("Неверный пароль.");return false;}
}
async function showAdd(btn){
  if(!await requireAdmin())return;
  currentView="add"; hidePages(); addPage.classList.remove("hidden"); syncNavActive(); fillCats(); drawAdmin();
  window.scrollTo({top:0,behavior:"smooth"});
}
function fillCats(){fCat.innerHTML=cats.map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join("");}
function drawAdmin(){
  catList.innerHTML=cats.map((c,i)=>`<div class="admin-item"><b>${esc(c)}</b><button class="btn" onclick="deleteCategory(${i})">Удалить</button></div>`).join("");
  dishAdmin.innerHTML=dishes.map(d=>`<div class="admin-item"><div><b>${esc(d.name)}</b><div class="small">${esc(d.cat)}</div></div><div class="actions"><button class="btn" onclick="editDish(${JSON.stringify(d.id)})">Изменить</button><button class="btn" onclick="deleteDish(${JSON.stringify(d.id)})">Удалить</button></div></div>`).join("");
}
function addCategory(){
  if(!adminUnlocked)return alert("Сначала откройте раздел «Добавить» и введите пароль.");
  const n=newCat.value.trim(); if(!n)return alert("Введите название категории.");
  if(cats.some(c=>c.toLowerCase()===n.toLowerCase()))return alert("Такая категория уже существует.");
  cats.push(n);persist();newCat.value="";renderNav();fillCats();drawAdmin();
}
function deleteCategory(i){
  if(!adminUnlocked)return alert("Сначала откройте раздел «Добавить» и введите пароль.");
  const c=cats[i]; if(dishes.some(d=>d.cat===c))return alert("Нельзя удалить категорию, пока в ней есть блюда. Сначала удалите или перенесите блюда.");
  if(!confirm(`Удалить категорию «${c}»?`))return;
  cats.splice(i,1);persist();renderNav();fillCats();drawAdmin();
}
function saveDish(){
  if(!adminUnlocked)return alert("Сначала откройте раздел «Добавить» и введите пароль.");
  const name=fName.value.trim();if(!name)return alert("Введите название блюда.");if(!cats.length)return alert("Сначала создайте хотя бы одну категорию.");
  const finish=photo=>{
    const existing=editId!==null?dishes.find(x=>String(x.id)===String(editId)):null;
    const obj={id:editId!==null?editId:Date.now(),cat:fCat.value,name,desc:fDesc.value.trim(),ing:fIng.value.trim(),nutrition:{kcal:fKcal.value.trim(),protein:fProtein.value.trim(),fat:fFat.value.trim(),carbs:fCarbs.value.trim()},photo:photo||"",addedAt:existing?.addedAt||(editId!==null?undefined:Date.now())};
    if(editId!==null){const i=dishes.findIndex(x=>String(x.id)===String(editId));if(i>=0)dishes[i]=obj;}else dishes.push(obj);
    persist();cancelEdit();renderNav();fillCats();drawAdmin();syncNavActive();
  };
  const file=fPhoto.files[0];
  if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file);}else finish(editId!==null?(dishes.find(x=>String(x.id)===String(editId))||{}).photo:"");
}
function editDish(id){
  if(!adminUnlocked)return alert("Сначала откройте раздел «Добавить» и введите пароль.");
  const d=dishes.find(x=>String(x.id)===String(id));if(!d)return;
  editId=d.id;fCat.value=d.cat;fName.value=d.name;fDesc.value=d.desc||"";fIng.value=d.ing||"";const n=d.nutrition||{};fKcal.value=n.kcal??"";fProtein.value=n.protein??"";fFat.value=n.fat??"";fCarbs.value=n.carbs??"";fPhoto.value="";formTitle.textContent="Изменить блюдо";window.scrollTo({top:0,behavior:"smooth"});
}
function cancelEdit(){editId=null;formTitle.textContent="Новое блюдо";fName.value="";fDesc.value="";fIng.value="";fKcal.value="";fProtein.value="";fFat.value="";fCarbs.value="";fPhoto.value="";}
function deleteDish(id){
  if(!adminUnlocked)return alert("Сначала откройте раздел «Добавить» и введите пароль.");
  if(!confirm("Удалить блюдо?"))return;
  const i=dishes.findIndex(x=>String(x.id)===String(id));if(i>=0)dishes.splice(i,1);
  const c=cartItems();delete c[id];saveCart(c);persist();drawAdmin();if(currentView==="menu")drawMenu(currentFilter);
}

function isNewDish(d){const t=Number(d&&d.addedAt);return Number.isFinite(t)&&t>0&&(Date.now()-t)<7*24*60*60*1000;}
function newBadge(d){return isNewDish(d)?'<span class="new-badge">Новинка</span>':'';}
function validNutrition(v){return v!==""&&v!==null&&v!==undefined&&Number.isFinite(Number(v));}
function nutrition(d){
  const n=d&&d.nutrition||{};
  const values=[["К",n.kcal,false],["Б",n.protein,true],["Ж",n.fat,true],["У",n.carbs,true]];
  return '<div class="nutrition"><div class="nutrition-pill">'+values.map(([label,v,grams])=>`<span>${label}: ${validNutrition(v)?esc(v)+(grams?' г':''):'—'}</span>`).join("")+'</div></div>';
}
function photoMarkup(d){
  if(!d.photo)return '<div class="photo empty">🍽️</div>';
  return `<img class="photo" src="${escAttr(d.photo)}" alt="" loading="lazy" draggable="false" onerror="this.onerror=null;this.classList.add('is-broken');this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22800%22 height=%22500%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23151515%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23777%22%3E🍽️%3C/text%3E%3C/svg%3E'">`;
}
function card(d){
  return `<article class="card" data-fa-dish-key="${escAttr(d.id)}" role="button" tabindex="0" aria-expanded="false">${newBadge(d)}${photoMarkup(d)}<div class="body"><div class="name">${esc(d.name)}</div><div class="desc">${esc(d.desc||"")}</div><div class="ing">${esc(d.ing||"")}</div>${nutrition(d)}<button class="btn primary add-to-cart" onclick="event.stopPropagation();addToCart(${JSON.stringify(d.id)})">Добавить в корзину</button></div></article>`;
}
function dailyCard(label,d){
  if(!d)return `<article class="daily-card" role="button" tabindex="0" aria-expanded="false"><div class="body"><div class="daily-label">${esc(label)}</div><div class="name">Нет блюд в этой категории</div></div></article>`;
  return `<article class="daily-card" data-fa-dish-key="${escAttr(d.id)}" role="button" tabindex="0" aria-expanded="false">${newBadge(d)}${photoMarkup(d)}<div class="body"><div class="daily-label">${esc(label)}</div><div class="name">${esc(d.name)}</div><div class="desc">${esc(d.desc||"")}</div><div class="ing">${esc(d.ing||"")}</div>${nutrition(d)}<button class="btn primary add-to-cart" onclick="event.stopPropagation();addToCart(${JSON.stringify(d.id)})">Добавить в корзину</button></div></article>`;
}
function drawMenu(filter){
  currentFilter=filter||"all";
  let html="";
  cats.forEach(cat=>{
    if(currentFilter!=="all"&&currentFilter!==cat)return;
    const list=dishes.filter(d=>d.cat===cat);if(!list.length)return;
    html+=`<section><h2>${esc(cat)}</h2><div class="grid">${list.map(card).join("")}</div></section>`;
  });
  menuPage.innerHTML=html||(dishes.length?'<p class="menu-loading">В этой категории пока нет блюд.</p>':'<p class="menu-loading">Загрузка меню…</p>');
  if(currentView==="menu")syncNavActive();
}
function refreshDaily(){
  const last=Number(localStorage.getItem("dailyMenuLastRefresh")||0);
  if(Date.now()-last<300000)return;
  localStorage.setItem("dailyMenuLastRefresh",String(Date.now()));
  localStorage.removeItem("dailyMenuSelection");
}
function toggleDishCard(cardEl){
  if(!cardEl)return;
  const expanded=!cardEl.classList.contains("expanded");
  document.querySelectorAll(".card.expanded,.daily-card.expanded").forEach(el=>{if(el!==cardEl){el.classList.remove("expanded");el.setAttribute("aria-expanded","false");}});
  cardEl.classList.toggle("expanded",expanded);cardEl.setAttribute("aria-expanded",expanded?"true":"false");
}
document.addEventListener("click",e=>{const cardEl=e.target.closest(".card,.daily-card");if(!cardEl||e.target.closest("button,input,select,textarea,a"))return;toggleDishCard(cardEl);});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const cardEl=e.target.closest(".card,.daily-card");if(!cardEl||e.target!==cardEl)return;e.preventDefault();toggleDishCard(cardEl);});
document.addEventListener("dragstart",e=>{if(e.target.matches("img.photo"))e.preventDefault();});

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escAttr(v){return esc(v).replace(/`/g,"&#096;");}

applyTheme();applyBackground();renderNav();fillCats();drawMenu("all");updateCartBadge();
window.addEventListener("pageshow",()=>{applyTheme();applyBackground();syncNavActive();});
