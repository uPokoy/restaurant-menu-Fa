name: Update sync loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current sync loaders
        shell: python
        run: |
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cloud = 'fa-cloud-sync-v27-loader.js'
          cart = 'fa-cart-sync-loader.js'
          cart_tag = '<script src="fa-cart-sync-loader.js?build=1.2"></script>'
          if cloud not in s:
              raise SystemExit('current cloud sync loader reference not found')
          if cart not in s:
              marker = '<head>'
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, marker + '\n' + cart_tag, 1)
          else:
              s = re.sub(r'<script src="fa-cart-sync-loader\.js(?:\?build=[^"]+)?"></script>', cart_tag, s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Commit index change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep current sync loaders'
          git push
