name: Install Supabase cloud sync
on:
  push:
    paths:
      - 'FA_SYNC_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sync
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FA_CLOUD_SYNC_V1 -->'
          if marker in s:
              raise SystemExit(0)
          block='''<script>
/* <!-- FA_CLOUD_SYNC_V1 --> */
(function(){
const API='https://jrpialhwbliicbsmzmvb.supabase.co/functions/v1/menu-sync';
const TS='restaurantMenuCloudUpdatedAtFA';
let applying=false;
function setTs(t){try{localStorage.setItem(TS,String(t))}catch(e){}}
function getTs(){return Number(localStorage.getItem(TS)||0)}
async function upload(){if(applying||!Array.isArray(window.cats)||!Array.isArray(window.dishes))return;const t=new Date().toISOString();try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'main',data:{cats:window.cats,dishes:window.dishes},updated_at:t})});if(r.ok)setTs(Date.parse(t))}catch(e){console.warn('cloud upload',e)}}
async function download(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)return;const rows=await r.json();const row=Array.isArray(rows)?rows[0]:null;if(!row||!row.data)return;const rt=Date.parse(row.updated_at||'')||0;if(rt<=getTs())return;applying=true;window.cats=Array.isArray(row.data.cats)?row.data.cats:[];window.dishes=Array.isArray(row.data.dishes)?row.data.dishes:[];localStorage.setItem('restaurantMenu',JSON.stringify(window.dishes));localStorage.setItem('restaurantMenuCats',JSON.stringify(window.cats));setTs(rt);if(typeof window.renderNav==='function')window.renderNav();if(typeof window.fillCats==='function')window.fillCats();if(typeof window.drawMenu==='function')window.drawMenu('all');if(typeof window.drawAdmin==='function')window.drawAdmin();if(typeof window.updateCartBadge==='function')window.updateCartBadge();if(typeof window.applyTheme==='function')window.applyTheme();if(typeof window.applyDishTransparency==='function')window.applyDishTransparency();if(typeof window.applyNavTransparency==='function')window.applyNavTransparency();if(typeof window.applyCategoryTransparency==='function')window.applyCategoryTransparency();if(typeof window.applyBackground==='function')window.applyBackground()}catch(e){console.warn('cloud download',e)}finally{applying=false}}
function install(){const p=window.persist;if(typeof p==='function'&&!p.__faCloud){function w(){const r=p.apply(this,arguments);if(!applying){setTs(Date.now());clearTimeout(w.t);w.t=setTimeout(upload,250)}return r}w.__faCloud=true;window.persist=w}download()}
setTimeout(install,0);setInterval(download,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)download()});window.restaurantMenuCloudSync={upload,download};
})();
</script>'''
          s=s.replace('</body>',block+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect FA menu to Supabase sync'
          git push
