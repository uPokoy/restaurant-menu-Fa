name: Install Supabase cloud sync
on:
  push:
    paths:
      - 'FA_SYNC_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sync script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FA_CLOUD_SYNC_V1 -->'
          if marker in s:
              raise SystemExit(0)
          block='<script src="fa-cloud-sync.js"></script>\n'
          if 'fa-cloud-sync.js' not in s:
              s=s.replace('</body>',block+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect FA menu to Supabase sync'
          git push
