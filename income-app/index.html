<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>Мои доходы</title>
</head>
<body>
<div class="app">
<header><div><div class="eyebrow">ФИНАНСЫ</div><h1>Мои доходы</h1></div><button id="syncBtn" class="icon-btn" aria-label="Синхронизация">↻</button></header>
<section class="cards"><div class="card main"><span>Доход за месяц</span><strong id="monthTotal">0 €</strong><small id="monthLabel"></small></div><div class="card"><span>За год</span><strong id="yearTotal">0 €</strong></div><div class="card"><span>Операций</span><strong id="count">0</strong></div></section>
<nav class="tabs"><button class="tab active" data-tab="dashboard">Сводка</button><button class="tab" data-tab="history">История</button><button class="tab" data-tab="settings">Настройки</button></nav>
<main>
<section id="dashboard" class="panel active"><div class="section-head"><h2>Доходы по месяцам</h2><select id="currency"><option>€</option><option>₽</option><option>$</option></select></div><div id="months" class="months"></div><div class="section-head"><h2>По источникам</h2></div><div id="sources" class="sources"></div></section>
<section id="history" class="panel"><div class="section-head"><h2>История</h2><button id="addTop" class="primary">+ Доход</button></div><div id="historyList" class="list"></div></section>
<section id="settings" class="panel"><div class="section-head"><h2>Синхронизация</h2></div><div class="notice">Данные синхронизируются с облаком после входа. Локальная копия сохраняется на устройстве.</div><div class="auth"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Пароль"><div><button id="signIn" class="primary">Войти</button><button id="signUp" class="secondary">Регистрация</button></div><p id="authStatus"></p></div><button id="exportBtn" class="secondary full">Экспорт данных</button><label class="secondary full file">Импорт данных<input id="importFile" type="file" accept="application/json"></label></section>
</main>
<button id="fab" class="fab">+</button>
</div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h2>Добавить доход</h2><button id="closeModal">×</button></div><label>Дата<input id="date" type="date"></label><label>Источник<select id="source"><option>Зарплата</option><option>Подработка</option><option>Фриланс</option><option>Продажи</option><option>Инвестиции</option><option>Другое</option></select></label><label>Описание<input id="description" placeholder="Например: зарплата за сентябрь"></label><label>Сумма<input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></label><button id="save" class="primary full">Сохранить</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
